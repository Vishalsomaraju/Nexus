<!DOCTYPE html>

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .mesh-gradient {
            background-image: 
                radial-gradient(at 0% 0%, rgba(114, 0, 163, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(0, 229, 255, 0.1) 0px, transparent 50%);
        }
        .input-glow:focus {
            box-shadow: 0 4px 12px -2px rgba(0, 229, 255, 0.3);
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #849396;
            border-radius: 10px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #00daf3;
        }

<style>
    body {
      min-height: max(884px, 100dvh);
    }

<body class="bg-surface-container-lowest text-on-surface font-body-md text-body-md min-h-screen flex flex-col items-center justify-center p-margin-mobile overflow-hidden relative mesh-gradient">
<!-- Atmospheric Elements -->
<div class="absolute inset-0 pointer-events-none">
<div class="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] bg-on-secondary-fixed-variant/20 blur-[120px] rounded-full"></div>
<div class="absolute bottom-[-10%] right-[-10%] w-[40%] h-[40%] bg-primary-container/10 blur-[120px] rounded-full"></div>
</div>
<!-- Main Content Shell -->
<main class="w-full max-w-[440px] z-10 flex flex-col items-center">
<!-- Logo Area -->
<div class="mb-lg flex flex-col items-center">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile font-bold tracking-widest text-primary uppercase mb-xs">NEXUS</h1>
<p class="font-label-md text-label-md text-outline tracking-[0.2em] uppercase">Access Terminal</p>
</div>
<!-- Central Auth Card -->
<div class="w-full backdrop-blur-xl bg-white/5 border border-white/10 rounded-xl p-md shadow-2xl relative overflow-hidden">
<!-- Glass Shine Effect -->
<div class="absolute top-0 left-0 w-full h-[1px] bg-gradient-to-r from-transparent via-white/20 to-transparent"></div>
<!-- Tab Switcher -->
<div class="relative flex bg-surface-container-high/50 rounded-lg p-1 mb-lg" id="auth-tabs">
<div class="absolute top-1 bottom-1 left-1 w-[calc(50%-4px)] bg-primary-container rounded-md transition-all duration-300 ease-out shadow-[0_0_10px_rgba(0,229,255,0.4)]" id="tab-indicator"></div>
<button class="relative z-10 flex-1 py-2 font-label-md text-label-md text-on-primary-fixed uppercase transition-colors duration-300" id="btn-login" onclick="switchTab('login')">Login</button>
<button class="relative z-10 flex-1 py-2 font-label-md text-label-md text-outline uppercase transition-colors duration-300" id="btn-signup" onclick="switchTab('signup')">Sign Up</button>
</div>
<!-- Forms Container -->
<div class="space-y-md">
<!-- Login Form (Visible by default) -->
<form class="space-y-md flex flex-col" id="login-form">
<div class="space-y-xs group">
<label class="font-label-md text-label-md text-outline group-focus-within:text-primary-container transition-colors">Digital Identity (Email)</label>
<input class="w-full bg-transparent border-b-2 border-outline-variant focus:border-primary-container outline-none py-2 font-body-md text-body-md text-on-surface placeholder:text-outline/30 transition-all duration-300 input-glow" placeholder="user@nexus.io" type="email"/>
</div>
<div class="space-y-xs group">
<div class="flex justify-between items-center">
<label class="font-label-md text-label-md text-outline group-focus-within:text-primary-container transition-colors">Access Code (Password)</label>
<a class="font-label-md text-label-md text-primary/60 hover:text-primary transition-colors" href="#">FORGOT?</a>
</div>
<input class="w-full bg-transparent border-b-2 border-outline-variant focus:border-primary-container outline-none py-2 font-body-md text-body-md text-on-surface placeholder:text-outline/30 transition-all duration-300 input-glow" placeholder="••••••••" type="password"/>
</div>
<button class="w-full mt-sm py-4 bg-gradient-to-r from-primary-container to-secondary-container rounded-lg font-headline-sm text-on-primary-fixed uppercase tracking-wider active:scale-95 transition-all duration-200 hover:shadow-[0_0_20px_rgba(0,229,255,0.4)] flex items-center justify-center gap-2" type="submit">
<span>Initialize Session</span>
<span class="material-symbols-outlined text-[20px]">login</span>
</button>
</form>
<!-- Signup Form (Hidden) -->
<form class="hidden space-y-md flex flex-col" id="signup-form">
<div class="grid grid-cols-2 gap-sm">
<div class="space-y-xs group">
<label class="font-label-md text-label-md text-outline group-focus-within:text-primary-container">First Name</label>
<input class="w-full bg-transparent border-b-2 border-outline-variant focus:border-primary-container outline-none py-2 font-body-md text-body-md text-on-surface transition-all duration-300 input-glow" type="text"/>
</div>
<div class="space-y-xs group">
<label class="font-label-md text-label-md text-outline group-focus-within:text-primary-container">Last Name</label>
<input class="w-full bg-transparent border-b-2 border-outline-variant focus:border-primary-container outline-none py-2 font-body-md text-body-md text-on-surface transition-all duration-300 input-glow" type="text"/>
</div>
</div>
<div class="space-y-xs group">
<label class="font-label-md text-label-md text-outline group-focus-within:text-primary-container">Primary Email</label>
<input class="w-full bg-transparent border-b-2 border-outline-variant focus:border-primary-container outline-none py-2 font-body-md text-body-md text-on-surface placeholder:text-outline/30 transition-all duration-300 input-glow" placeholder="user@nexus.io" type="email"/>
</div>
<div class="space-y-xs group">
<label class="font-label-md text-label-md text-outline group-focus-within:text-primary-container">Secure Key</label>
<input class="w-full bg-transparent border-b-2 border-outline-variant focus:border-primary-container outline-none py-2 font-body-md text-body-md text-on-surface transition-all duration-300 input-glow" placeholder="Create strong password" type="password"/>
</div>
<button class="w-full mt-sm py-4 bg-gradient-to-r from-primary-container to-secondary-container rounded-lg font-headline-sm text-on-primary-fixed uppercase tracking-wider active:scale-95 transition-all duration-200 hover:shadow-[0_0_20px_rgba(0,229,255,0.4)] flex items-center justify-center gap-2" type="submit">
<span>Create Account</span>
<span class="material-symbols-outlined text-[20px]">person_add</span>
</button>
</form>
<!-- Divider -->
<div class="flex items-center gap-4 py-2">
<div class="flex-1 h-[1px] bg-white/10"></div>
<span class="font-label-md text-label-md text-outline/40">OR CONNECT WITH</span>
<div class="flex-1 h-[1px] bg-white/10"></div>
</div>
<!-- Social Authentication -->
<div class="grid grid-cols-1 gap-sm">
<button class="w-full py-3 flex items-center justify-center gap-3 border border-white/10 hover:border-primary-container/50 hover:bg-white/5 transition-all duration-300 rounded-lg group active:scale-95">
<svg class="w-5 h-5 fill-on-surface group-hover:fill-primary-container transition-colors" viewbox="0 0 24 24">
<path d="M12.48 10.92v3.28h7.84c-.24 1.84-.908 3.152-1.928 4.176-1.224 1.224-3.136 2.52-6.648 2.52-5.392 0-9.752-4.36-9.752-9.752s4.36-9.752 9.752-9.752c2.936 0 5.168 1.152 6.776 2.68l2.32-2.32C18.424 1.216 15.712 0 12.48 0 5.688 0 0 5.688 0 12.48s5.688 12.48 12.48 12.48c3.704 0 6.504-1.224 8.712-3.52 2.272-2.272 2.992-5.472 2.992-8.128 0-.792-.064-1.544-.192-2.24h-11.512z"></path>
</svg>
<span class="font-label-md text-label-md text-outline group-hover:text-on-surface transition-colors">Continue with Google</span>
</button>
<button class="w-full py-3 flex items-center justify-center gap-3 border border-white/10 hover:border-primary-container/50 hover:bg-white/5 transition-all duration-300 rounded-lg group active:scale-95">
<svg class="w-5 h-5 fill-on-surface group-hover:fill-primary-container transition-colors" viewbox="0 0 24 24">
<path d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.43.372.823 1.102.823 2.222 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"></path>
</svg>
<span class="font-label-md text-label-md text-outline group-hover:text-on-surface transition-colors">Continue with GitHub</span>
</button>
</div>
</div>
</div>
<!-- Footer Links -->
<div class="mt-lg flex gap-lg opacity-40 hover:opacity-100 transition-opacity duration-500">
<a class="font-label-md text-label-md text-outline hover:text-primary-container uppercase tracking-widest" href="#">Privacy</a>
<a class="font-label-md text-label-md text-outline hover:text-primary-container uppercase tracking-widest" href="#">Protocol</a>
<a class="font-label-md text-label-md text-outline hover:text-primary-container uppercase tracking-widest" href="#">Support</a>
</div>
</main>
<!-- Scanline Overlay -->
<div class="fixed inset-0 pointer-events-none z-50 opacity-[0.03]" style="background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06)); background-size: 100% 2px, 3px 100%;"></div>
<script>
        function switchTab(type) {
            const loginForm = document.getElementById('login-form');
            const signupForm = document.getElementById('signup-form');
            const indicator = document.getElementById('tab-indicator');
            const btnLogin = document.getElementById('btn-login');
            const btnSignup = document.getElementById('btn-signup');

            if (type === 'login') {
                loginForm.classList.remove('hidden');
                signupForm.classList.add('hidden');
                indicator.style.transform = 'translateX(0)';
                btnLogin.classList.add('text-on-primary-fixed');
                btnLogin.classList.remove('text-outline');
                btnSignup.classList.remove('text-on-primary-fixed');
                btnSignup.classList.add('text-outline');
            } else {
                loginForm.classList.add('hidden');
                signupForm.classList.remove('hidden');
                indicator.style.transform = 'translateX(calc(100% + 8px))';
                btnSignup.classList.add('text-on-primary-fixed');
                btnSignup.classList.remove('text-outline');
                btnLogin.classList.remove('text-on-primary-fixed');
                btnLogin.classList.add('text-outline');
            }
        }

        // Add subtle mouse-tracking glow to the card
        document.addEventListener('mousemove', (e) => {
            const card = document.querySelector('.backdrop-blur-xl');
            const rect = card.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            card.style.setProperty('--mouse-x', `${x}px`);
            card.style.setProperty('--mouse-y', `${y}px`);
        });
    </script>
<style>
        /* Interactive Card Background */
        .backdrop-blur-xl::after {
            content: "";
            position: absolute;
            inset: 0;
            background: radial-gradient(400px circle at var(--mouse-x) var(--mouse-y), rgba(0, 229, 255, 0.05), transparent 40%);
            z-index: -1;
            pointer-events: none;
        }
    </style>
</body></html>
